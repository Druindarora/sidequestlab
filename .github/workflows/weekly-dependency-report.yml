name: Weekly Dependency Report

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dependency-report:
    name: Collect dependency report for dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            apps/public-site/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Collect and normalize dependency data
        env:
          GH_TOKEN: ${{ github.token }}
          ANALYZED_BRANCH: dev
        run: >-
          python3 scripts/dependency-report.py
          --output dependency-report.json
          --raw-directory dependency-report-raw
          --summary dependency-report-summary.md

      - name: Publish dependency report summary
        run: cat dependency-report-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload normalized dependency report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: dependency-report.json
          if-no-files-found: error

      - name: Upload raw dependency data
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report-raw
          path: dependency-report-raw/
          if-no-files-found: error
